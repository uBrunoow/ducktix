name: ducktix

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ducktix
    ports:
      - '27017:27017'
    volumes:
      - ducktix_mongodata:/data/db
      # O script de criação do banco fica acessível dentro do container para
      # rodar com `mongosh` (ver database/README.md). Não fica em
      # /docker-entrypoint-initdb.d de propósito: a criação é um passo
      # explícito (`pnpm db:setup`), igual para Docker e para o Atlas.
      - ./database:/database:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  ducktix_mongodata:
